name: build-desktop
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (如 1.0.22)'
        required: true
        default: '1.0.22'
  push:
    paths:
      - 'gui.py'
      - '1b1t'
      - '.github/workflows/build-desktop.yml'

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cp 1b1t core1b1t.py
          cp 1b1t 1b1t_cli.py
          pip install pyinstaller PySide6
          pyinstaller -F -n 1b1t 1b1t_cli.py
          pyinstaller -F -w -n 1b1t-gui gui.py
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: |
            dist/1b1t.exe
            dist/1b1t-gui.exe

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          cp 1b1t core1b1t.py
          cp 1b1t 1b1t_cli.py
          pip install pyinstaller PySide6
          pyinstaller -F -n 1b1t 1b1t_cli.py
          pyinstaller -F -w -n 1b1t-gui gui.py
          mkdir dmg
          cp -R dist/1b1t-gui.app dmg/
          cp dist/1b1t dmg/1b1t
          printf '把 1b1t-gui.app 拖进 Applications 即可使用图形版;\n终端命令行版: 把 1b1t 复制到 /usr/local/bin/ (sudo cp 1b1t /usr/local/bin/)\n' > dmg/安装说明.txt
          hdiutil create -volname "1b1t-open-server" -srcfolder dmg -ov -format UDZO 1b1t-open-server_macos.dmg
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: 1b1t-open-server_macos.dmg
